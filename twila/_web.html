<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twila — decide fast, think deep, pay only what's needed</title>
<style>
  :root {
    --bg: #fdf2e3; --panel: #fffdf5; --line: #000;
    --text: #111; --dim: #5a5148;
    --s1: #ffd43b;      /* system 1 yellow */
    --s2: #3ee8b5;      /* system 2 mint   */
    --warn: #ff6b6b; --ok: #51d88a;
    --shadow: 4px 4px 0 #000; --shadow-sm: 3px 3px 0 #000;
  }
  * { box-sizing: border-box; margin: 0 }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  ::selection { background: var(--s1) }
  header {
    border-bottom: 3px solid var(--line); padding: 14px 20px;
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  .mark { font: 20px "Arial Black", system-ui, sans-serif; letter-spacing: .01em; }
  .mark b { background: var(--s1); border: 2px solid #000; box-shadow: var(--shadow-sm);
    padding: 1px 7px; color: #000; display: inline-block }
  .mark i { font-style: normal; background: var(--s2); border: 2px solid #000;
    box-shadow: var(--shadow-sm); padding: 1px 7px; display: inline-block; margin-left: 2px }
  .tagline { color: var(--text); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em }
  #stats { margin-left: auto; color: var(--text); font-size: 12.5px; font-weight: 700;
    font-variant-numeric: tabular-nums; border: 2px solid #000; box-shadow: var(--shadow-sm);
    background: var(--panel); padding: 5px 10px }
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth }
  .col { max-width: 800px; margin: 0 auto; padding: 24px 16px 40px }
  .q { text-align: right; margin: 20px 0 4px }
  .q span {
    display: inline-block; background: var(--s1); border: 3px solid var(--line);
    box-shadow: var(--shadow); padding: 10px 14px; max-width: 85%; font-weight: 600;
  }
  .gate {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px;
    font: 700 11.5px/1 ui-monospace, monospace; text-transform: uppercase;
  }
  .chip {
    border: 2px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 9px; box-shadow: var(--shadow-sm); animation: pop .2s ease;
  }
  .chip.s1 { background: var(--s1) }
  .chip.s2 { background: var(--s2) }
  .chip.warn { background: var(--warn); color: #000 }
  .chip.ok { background: var(--ok) }
  .chip em { font-style: normal; color: var(--dim) }
  @keyframes pop { from { transform: translate(-2px, 6px); opacity: 0 } }
  .a { white-space: pre-wrap; background: var(--panel); border: 3px solid var(--line);
    box-shadow: var(--shadow); padding: 14px 16px; margin: 4px 0 16px }
  .a thinking { display: block; color: var(--dim); font: 12.5px/1.55 ui-monospace, monospace;
    border: 2px dashed var(--line); background: var(--bg); padding: 8px 10px; margin: 0 0 10px; white-space: pre-wrap }
  details { margin: 0 0 20px; color: var(--text); font-size: 12px; font-weight: 700 }
  details summary { cursor: pointer; user-select: none; display: inline-block;
    border: 2px solid var(--line); box-shadow: var(--shadow-sm); background: var(--panel); padding: 6px 11px }
  details summary:hover { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000 }
  details pre { margin: 8px 0 0; padding: 12px; background: var(--bg);
    border: 3px solid var(--line); box-shadow: var(--shadow); overflow-x: auto }
  details pre, details pre * { white-space: pre; }
  form { border-top: 3px solid var(--line); padding: 14px 16px; display: flex; gap: 10px; background: var(--panel) }
  .colf { max-width: 800px; margin: 0 auto; width: 100%; display: flex; gap: 10px }
  input {
    flex: 1; background: #fff; border: 3px solid var(--line); box-shadow: var(--shadow-sm);
    color: var(--text); padding: 12px 14px; font: inherit; outline: none;
  }
  input:focus { box-shadow: var(--shadow) }
  button {
    background: var(--s1); border: 3px solid var(--line); box-shadow: var(--shadow);
    color: #000; font: 900 15px "Arial Black", system-ui, sans-serif; text-transform: uppercase;
    padding: 0 22px; cursor: pointer;
  }
  button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000 }
  button:disabled { opacity: .55; cursor: default; transform: none }
  .empty { color: var(--text); text-align: left; margin-top: 10vh; background: var(--panel);
    border: 3px solid var(--line); box-shadow: 6px 6px 0 #000; padding: 26px 30px }
  #wait { font-weight: 700; text-transform: uppercase; font-size: 12px; margin: 10px 0 14px }
  .empty h2 { font: 900 34px "Arial Black", system-ui, sans-serif; text-transform: uppercase;
    margin: 0 0 10px; text-decoration: underline 4px var(--s1); text-underline-offset: 7px }
  .pill { display:inline-block; width: 10px; height: 10px; background: var(--s1);
    border: 2px solid #000; animation: blink 1s infinite; margin-right:8px; }
  @keyframes blink { 50% { opacity: .15 } }
</style>
</head>
<body>
<header>
  <div class="mark"><b>twil</b><i>a</i></div>
  <div class="tagline">system&nbsp;1 decides &middot; system&nbsp;2 thinks &middot; every decision visible</div>
  <div id="stats">loading…</div>
</header>

<main><div class="col" id="log">
  <div class="empty"><h2>Ask anything.</h2>
  Laya (421M) answers domain, difficulty, effort and policy questions about your message in one forward pass — TwIL-8B (8.8B) then reasons exactly as hard as was decided.</div>
</div></main>

<form id="f"><div class="colf">
  <input id="in" placeholder="ask twila… (receipts saved to ~/.twila/receipts)" autocomplete="off">
  <button id="btn">Ask</button>
</div></form>

<script>
const $ = s => document.querySelector(s);
const esc = t => t.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function chip(cls, label, val, dim) {
  return `<span class="chip ${cls}">${label}${dim?` <em>${dim}</em>`:""}${val!==undefined&&val!==null?` ${val}`:""}</span>`;
}

function renderGate(g, v, gen, retried) {
  const lvlName = {0:"one-liner",1:"steps",2:"contest"}[g.difficulty] ?? g.difficulty;
  let chips =
    chip("s1","laya", g.latency_ms+"ms") +
    chip("s1","domain", g.domain) +
    chip("s1","effort", lvlName) +
    chip("","budget", (g.budget||0).toLocaleString()+" tok") +
    chip("", "thinking", g.thinking?"on":"off") +
    chip("s2","twil", Math.round(gen.latency||0)+"s", (gen.tokens_out||0)+" tok");
  if (v) chips += chip((v.answered>0.5&&v.confidence>0.3)?"ok":"warn","verify",(v.confidence).toFixed(2));
  if (retried) chips += chip("warn","retried");
  return `<div class="gate">${chips}</div>`;
}

async function stats() {
  const s = await (await fetch("/api/stats")).json();
  $("#stats").innerHTML = `${s.decisions} decisions &middot; avg gate <b>${s.avg_gate_ms??"—"}ms</b> &middot; ${s.tokens_out.toLocaleString()} tok spent`;
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const txt = $("#in").value.trim(); if (!txt) return;
  $("#in").value = ""; $("#btn").disabled = true;
  const log = $("#log"); const empty = log.querySelector(".empty"); if (empty) empty.remove();
  log.insertAdjacentHTML("beforeend", `<div class="q"><span>${esc(txt)}</span></div>
    <div id="wait"><span class="pill"></span>laya is deciding…</div>`);
  log.scrollTop = log.scrollHeight;
  try {
    const r = await (await fetch("/api/ask", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message: txt})})).json();
    $("#wait")?.remove();
    if (r.error) { log.insertAdjacentHTML("beforeend", `<div class="a" style="color:var(--warn)">${r.error}</div>`); return; }
    const chips = renderGate(r.gate, r.verify, r.generation, r.retried);
    const answer = esc(r.answer).replace(/think[a-z]&gt;/g,"").replace(/&gt;\n\n?/g,"");
    log.insertAdjacentHTML("beforeend", `${chips}<div class="a">${answer}</div>`);
  } catch (err) {
    $("#wait")?.remove();
    log.insertAdjacentHTML("beforeend", `<div class="a" style="color:var(--warn)">harness unreachable — is scripts/serve.sh running?</div>`);
  }
  stats();
  log.scrollTop = log.scrollHeight;
  $("#btn").disabled = false; $("#in").focus();
});
stats(); $("#in").focus();
</script>
</body>
</html>
