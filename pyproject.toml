[project]
name = "twila"
version = "0.1.0"
description = "TwIL-8B harness with Laya System-1 routing: chat, receipts, and the eval that proves the router saves tokens."
requires-python = ">=3.12"
dependencies = [
    "laya",
    "torch",
    "openai>=1.100",
    "huggingface-hub>=1.0",
    "rich>=14.0",
]

[project.scripts]
twila = "twila.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.uv]
# CPU-only torch: this harness never needs CUDA and the colabs.
# Torch CUDA wheels are ~3GB of download for nothing.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twila"]
